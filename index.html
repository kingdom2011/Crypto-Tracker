<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Tracker | CoinGecko API</title>
  <style>
    :root {
      --primary: #6200ee;
      --positive: #28a745;
      --negative: #dc3545;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #dee2e6;
    }
    .dark-mode {
      --primary: #bb86fc;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e1e1e1;
      --border: #333333;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: calc(100vw - 100px);
      margin: 0 50px;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      color: var(--primary);
    }
    .status {
      font-size: 0.9em;
      color: #666;
    }
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .exchange-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      width: 100%;
    }
    .exchange-group {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .exchange-group label {
      margin-bottom: 5px;
      font-weight: 500;
    }
    .exchange-group .update-time {
      position: absolute;
      right: 0;
      top: 0;
      font-size: 0.7em;
      color: #666;
    }
    .exchange-group input,
    .exchange-group select {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      width: 100%;
    }
    #search {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
    }
    button {
      padding: 10px 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle-column-btn.active {
      background: var(--positive);
    }
    .table-container {
      overflow-x: auto;
      width: 100%;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
      table-layout: fixed;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      background: rgba(0,0,0,0.05);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    th:hover {
      background: rgba(0,0,0,0.08);
    }
    th.sort-asc::after {
      content: "↑";
      margin-left: 5px;
    }
    th.sort-desc::after {
      content: "↓";
      margin-left: 5px;
    }
    tr:hover {
      background: rgba(0,0,0,0.03);
    }
    /* Column width adjustments */
    th:nth-child(1), td:nth-child(1) { width: 50px; } /* Rank */
    th:nth-child(2), td:nth-child(2) { width: auto; min-width: 200px; } /* Name */
    th:nth-child(3), td:nth-child(3) { width: 130px; } /* Price (IRT) */
    th:nth-child(4), td:nth-child(4) { width: 120px; } /* Price (USD) */
    th:nth-child(5), td:nth-child(5) { width: 80px; } /* 24h % */
    th:nth-child(6), td:nth-child(6) { width: 80px; } /* 7D % */
    th:nth-child(7), td:nth-child(7) { width: 80px; } /* 30D % */
    th:nth-child(8), td:nth-child(8) { width: 90px; } /* 24h Min */
    th:nth-child(9), td:nth-child(9) { width: 90px; } /* 24h Max */
    th:nth-child(10), td:nth-child(10) { width: 90px; } /* 24h Inc */
    th:nth-child(11), td:nth-child(11) { width: 90px; } /* 7D Min */
    th:nth-child(12), td:nth-child(12) { width: 90px; } /* 7D Max */
    th:nth-child(13), td:nth-child(13) { width: 90px; } /* 7D Inc */
    th:nth-child(14), td:nth-child(14) { width: 90px; } /* 30D Min */
    th:nth-child(15), td:nth-child(15) { width: 90px; } /* 30D Max */
    th:nth-child(16), td:nth-child(16) { width: 90px; } /* 30D Inc */
    th:nth-child(17), td:nth-child(17) { width: 110px; } /* Market Cap */
    th:nth-child(18), td:nth-child(18) { width: 50px; } /* Favorite */
    .positive {
      color: var(--positive);
    }
    .negative {
      color: var(--negative);
    }
    .crypto-icon {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 50%;
    }
    .favorite-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 1.2em;
      color: #ccc;
    }
    .favorite-btn.active {
      color: gold;
    }
    #loading, #error {
      text-align: center;
      padding: 20px;
    }
    #loading {
      color: #666;
    }
    #error {
      color: var(--negative);
    }
    .editable-cell {
      padding: 0;
      position: relative;
    }
    .editable-cell input {
      width: 100%;
      height: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .editable-cell input:focus {
      outline: 2px solid var(--primary);
      background: var(--card-bg);
    }
    .coin-name {
      cursor: pointer;
      color: var(--primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: calc(100% - 30px);
      vertical-align: middle;
    }
    .coin-name:hover {
      text-decoration: underline;
    }
    /* Tooltip styles */
    .tooltip {
      position: relative;
      display: inline-block;
    }
    .tooltip .tooltiptext {
      visibility: hidden;
      width: 180px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 5px;
      position: absolute;
      z-index: 1;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 12px;
    }
    .tooltip:hover .tooltiptext {
      visibility: visible;
      opacity: 1;
    }
    @media (max-width: 768px) {
      body {
        width: calc(100vw - 40px);
        margin: 0 20px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      th, td {
        padding: 8px 10px;
      }
      .hide-mobile {
        display: none;
      }
      /* Adjust column widths for mobile */
      th:nth-child(3), td:nth-child(3) { width: 100px; } /* Price (IRT) */
      th:nth-child(4), td:nth-child(4) { width: 90px; } /* Price (USD) */
      th:nth-child(5), td:nth-child(5) { width: 70px; } /* 24h % */
      th:nth-child(6), td:nth-child(6) { width: 70px; } /* 7D % */
      th:nth-child(7), td:nth-child(7) { width: 70px; } /* 30D % */
      .tooltip .tooltiptext {
        width: 140px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>📊 Crypto Tracker</h1>
      <p class="status">Last updated: <span id="last-updated">Never</span></p>
    </div>
    <button id="theme-toggle">🌙 Dark Mode</button>
  </div>
  
  <!-- Exchange Controls -->
  <div class="exchange-controls">
    <div class="exchange-group">
      <label for="nobitex-price">Nobitex Price (USD)</label>
      <span class="update-time" id="nobitex-update-time"></span>
      <input type="number" id="nobitex-price" placeholder="Enter USD price" value="84000">
    </div>
    <div class="exchange-group">
      <label for="wallex-price">Wallex Price (USD)</label>
      <span class="update-time" id="wallex-update-time"></span>
      <input type="number" id="wallex-price" placeholder="Enter USD price" value="84000">
    </div>
    <div class="exchange-group">
      <label for="okexchange-price">OkExchange Price (USD)</label>
      <span class="update-time" id="okexchange-update-time"></span>
      <input type="number" id="okexchange-price" placeholder="Enter USD price" value="84000">
    </div>
    <div class="exchange-group">
      <label for="ramzinex-price">Ramzinex Price (USD)</label>
      <span class="update-time" id="ramzinex-update-time"></span>
      <input type="number" id="ramzinex-price" placeholder="Enter USD price" value="84000">
    </div>
  </div>
  
  <div class="controls">
    <input type="text" id="search" placeholder="Search cryptocurrencies...">
    <select id="exchange-select">
      <option value="nobitex" selected>Nobitex</option>
      <option value="wallex">Wallex</option>
      <option value="okexchange">OkExchange</option>
      <option value="ramzinex">Ramzinex</option>
    </select>
    <button id="toggle-24h" class="toggle-column-btn active">24H Data</button>
    <button id="toggle-7d" class="toggle-column-btn active">7D Data</button>
    <button id="toggle-30d" class="toggle-column-btn active">30D Data</button>
    <button id="save-to-github">💾 Save to GitHub</button>
    <button id="load-from-github">🔄 Load from GitHub</button>
    <button id="refresh-btn">🔄 Refresh</button>
    <button id="toggle-favorites">👀 Show All</button>
  </div>
  
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-sort="rank">#</th>
          <th data-sort="name">Coin</th>
          <th data-sort="price_irt">Price (IRT)</th>
          <th data-sort="price">Price (USD)</th>
          <th data-sort="change">24h %</th>
          <th data-sort="change_7d">7D %</th>
          <th data-sort="change_30d">30D %</th>
          <th class="time-column" data-timeframe="24h">24h Min</th>
          <th class="time-column" data-timeframe="24h">24h Max</th>
          <th class="time-column" data-timeframe="24h">24h Inc</th>
          <th class="time-column" data-timeframe="7d">7D Min</th>
          <th class="time-column" data-timeframe="7d">7D Max</th>
          <th class="time-column" data-timeframe="7d">7D Inc</th>
          <th class="time-column" data-timeframe="30d">30D Min</th>
          <th class="time-column" data-timeframe="30d">30D Max</th>
          <th class="time-column" data-timeframe="30d">30D Inc</th>
          <th data-sort="market_cap" class="hide-mobile">Market Cap</th>
          <th>⭐</th>
        </tr>
      </thead>
      <tbody id="crypto-data">
        <tr id="loading">
          <td colspan="18">Loading cryptocurrency data...</td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <p id="error"></p>

  <script>
    // ======================
    // GitHub Storage Setup
    // ======================
    const GITHUB_CONFIG = {
      repo: 'kingdom2011/Crypto-Tracker', // Replace with your repo
      branch: 'main',
      dataPath: 'data/crypto-data.json', // File to store your data
      token: '' // Will be set via prompt
    };

    // Initialize GitHub token (safe method)
    function initGitHubToken() {
      const savedToken = localStorage.getItem('github_token');
      if (!savedToken) {
        const token = prompt('Enter your GitHub Personal Access Token (repo scope):');
        if (token) {
          localStorage.setItem('github_token', token);
          GITHUB_CONFIG.token = token;
        }
      } else {
        GITHUB_CONFIG.token = savedToken;
      }
    }

    // Save data to GitHub
    async function saveToGitHub() {
      if (!GITHUB_CONFIG.token) {
        alert('Please set your GitHub token first');
        initGitHubToken();
        return;
      }

      const dataToSave = {
        favorites: state.favorites,
        exchangePrices: state.exchangePrices,
        dayRanges: state.dayRanges,
        weekRanges: state.weekRanges,
        monthRanges: state.monthRanges,
        lastUpdated: new Date().toISOString()
      };

      try {
        // 1. Get existing file SHA (required for updates)
        const getUrl = `https://api.github.com/repos/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.dataPath}`;
        const fileInfo = await fetch(getUrl, {
          headers: {
            'Authorization': `token ${GITHUB_CONFIG.token}`
          }
        }).then(res => res.json());

        // 2. Push the update
        const updateUrl = `https://api.github.com/repos/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.dataPath}`;
        const response = await fetch(updateUrl, {
          method: 'PUT',
          headers: {
            'Authorization': `token ${GITHUB_CONFIG.token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            message: 'Update crypto data',
            content: btoa(JSON.stringify(dataToSave)),
            sha: fileInfo.sha,
            branch: GITHUB_CONFIG.branch
          })
        });

        if (response.ok) {
          alert('Data saved to GitHub successfully!');
        } else {
          throw new Error('Failed to save');
        }
      } catch (error) {
        console.error('GitHub save error:', error);
        alert('Error saving to GitHub. Check console for details.');
      }
    }

    // Load data from GitHub
    async function loadFromGitHub() {
      try {
        const url = `https://raw.githubusercontent.com/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}/${GITHUB_CONFIG.dataPath}`;
        const response = await fetch(url);
        const data = await response.json();

        // Restore state
        state.favorites = data.favorites || [];
        state.exchangePrices = data.exchangePrices || state.exchangePrices;
        state.dayRanges = data.dayRanges || {};
        state.weekRanges = data.weekRanges || {};
        state.monthRanges = data.monthRanges || {};

        // Update UI
        renderTable();
        updateExchangeTimeDisplays();
        alert('Data loaded from GitHub!');
      } catch (error) {
        console.error('GitHub load error:', error);
        alert('Error loading from GitHub. Check console for details.');
      }
    }

    // ======================
    // Tooltip Implementation
    // ======================
    function updateTooltips() {
      document.querySelectorAll('.editable-cell').forEach(cell => {
        const input = cell.querySelector('input');
        const coinId = input?.getAttribute('onchange')?.match(/'([^']+)'/)?.[1];
        const type = input?.getAttribute('onchange')?.match(/'([^']+)'/)?.[2];

        if (coinId && type) {
          let updateTime;
          if (type === 'min') {
            updateTime = state.dayRanges[coinId]?.minUpdated ||
                    state.weekRanges[coinId]?.minUpdated ||
                    state.monthRanges[coinId]?.minUpdated;
          } else {
            updateTime = state.dayRanges[coinId]?.maxUpdated ||
                    state.weekRanges[coinId]?.maxUpdated ||
                    state.monthRanges[coinId]?.maxUpdated;
          }

          const tooltip = cell.querySelector('.tooltip');
          if (tooltip) {
            tooltip.textContent = updateTime ?
                    `Last updated: ${formatDateTime(updateTime)}` :
                    'Never updated';
          }
        }
      });
    }
    // Configuration
    const config = {
      refreshInterval: 60000, // 1 minute (60,000ms)
      maxCoins: 50, // Only top 50 coins
      apiUrl: 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50'
    };

    // Stable coin IDs to exclude
    const stableCoins = [
      'tether', 'usd-coin', 'binance-usd', 'dai', 'true-usd', 
      'paxos-standard', 'usd-coin-wormhole', 'gemini-dollar',
      'usds', 'bsc-usd', 'usde', 'susds', 'buidl',
      'binance-bridged-usdt-bnb-smart-chain', 'ethena-usde', 
      'blackrock-usd-institutional-digital-liquidity-fund',
      'lido-staked-ether', 'wrapped-bitcoin', 'wrapped-steth',
      'wrapped-eeth', 'coinbase-wrapped-staked-eth', 'weth',
      'bitget-token', 'whitebit', 'coinbase-wrapped-btc',
      'leo-token'
    ];

    // Special coin slugs for CoinMarketCap URLs
    const specialCoinSlugs = {
      'pi-network': 'pi',
      'ondo-finance': 'ondo-finance',
      'gatetoken': 'gatetoken'
    };

    // State
    let state = {
      allCoins: [],
      displayedCoins: [],
      favorites: JSON.parse(localStorage.getItem('cryptoFavorites')) || [],
      sortBy: 'rank',
      sortDir: 'asc',
      showFavorites: true,
      lastUpdated: null,
      exchangePrices: {
        nobitex: 84000,
        wallex: 84000,
        okexchange: 84000,
        ramzinex: 84000
      },
      exchangeUpdateTimes: {
        nobitex: null,
        wallex: null,
        okexchange: null,
        ramzinex: null
      },
      dayRanges: {},
      weekRanges: {},
      monthRanges: {},
      selectedExchange: 'nobitex',
      darkMode: localStorage.getItem('darkMode') === 'true',
      show24hColumns: true,
      show7dColumns: true,
      show30dColumns: true
    };

    // DOM Elements
    const elements = {
      tableBody: document.getElementById('crypto-data'),
      searchInput: document.getElementById('search'),
      refreshBtn: document.getElementById('refresh-btn'),
      toggleFavoritesBtn: document.getElementById('toggle-favorites'),
      lastUpdatedSpan: document.getElementById('last-updated'),
      errorPara: document.getElementById('error'),
      loadingRow: document.getElementById('loading'),
      exchangeSelect: document.getElementById('exchange-select'),
      nobitexInput: document.getElementById('nobitex-price'),
      wallexInput: document.getElementById('wallex-price'),
      okexchangeInput: document.getElementById('okexchange-price'),
      ramzinexInput: document.getElementById('ramzinex-price'),
      nobitexUpdateTime: document.getElementById('nobitex-update-time'),
      wallexUpdateTime: document.getElementById('wallex-update-time'),
      okexchangeUpdateTime: document.getElementById('okexchange-update-time'),
      ramzinexUpdateTime: document.getElementById('ramzinex-update-time'),
      themeToggle: document.getElementById('theme-toggle'),
      toggle24hBtn: document.getElementById('toggle-24h'),
      toggle7dBtn: document.getElementById('toggle-7d'),
      toggle30dBtn: document.getElementById('toggle-30d')
    };

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      updateTheme();
      
      const savedExchangeRates = localStorage.getItem('cryptoExchangeRates');
      if (savedExchangeRates) {
        state.exchangePrices = JSON.parse(savedExchangeRates);
        elements.nobitexInput.value = state.exchangePrices.nobitex;
        elements.wallexInput.value = state.exchangePrices.wallex;
        elements.okexchangeInput.value = state.exchangePrices.okexchange;
        elements.ramzinexInput.value = state.exchangePrices.ramzinex;
      }
      
      const savedUpdateTimes = localStorage.getItem('cryptoExchangeUpdateTimes');
      if (savedUpdateTimes) {
        state.exchangeUpdateTimes = JSON.parse(savedUpdateTimes);
        updateExchangeTimeDisplays();
      }
      
      const savedDayRanges = localStorage.getItem('cryptoDayRanges');
      if (savedDayRanges) state.dayRanges = JSON.parse(savedDayRanges);
      
      const savedWeekRanges = localStorage.getItem('cryptoWeekRanges');
      if (savedWeekRanges) state.weekRanges = JSON.parse(savedWeekRanges);
      
      const savedMonthRanges = localStorage.getItem('cryptoMonthRanges');
      if (savedMonthRanges) state.monthRanges = JSON.parse(savedMonthRanges);
      
      const saved24hVisibility = localStorage.getItem('show24hColumns');
      const saved7dVisibility = localStorage.getItem('show7dColumns');
      const saved30dVisibility = localStorage.getItem('show30dColumns');
      
      if (saved24hVisibility !== null) {
        state.show24hColumns = saved24hVisibility === 'true';
        elements.toggle24hBtn.classList.toggle('active', state.show24hColumns);
      }
      if (saved7dVisibility !== null) {
        state.show7dColumns = saved7dVisibility === 'true';
        elements.toggle7dBtn.classList.toggle('active', state.show7dColumns);
      }
      if (saved30dVisibility !== null) {
        state.show30dColumns = saved30dVisibility === 'true';
        elements.toggle30dBtn.classList.toggle('active', state.show30dColumns);
      }
      
      loadData();
      setupEventListeners();
      startAutoRefresh();
      updateColumnVisibility();

      initGitHubToken();

      // Add event listeners for new buttons
      document.getElementById('save-to-github').addEventListener('click', saveToGitHub);
      document.getElementById('load-from-github').addEventListener('click', loadFromGitHub);
    });

    // Theme functions
    function updateTheme() {
      if (state.darkMode) {
        document.body.classList.add('dark-mode');
        elements.themeToggle.textContent = '☀️ Light Mode';
      } else {
        document.body.classList.remove('dark-mode');
        elements.themeToggle.textContent = '🌙 Dark Mode';
      }
    }

    function toggleTheme() {
      state.darkMode = !state.darkMode;
      localStorage.setItem('darkMode', state.darkMode);
      updateTheme();
    }

    // Calculate percentage increase between min and max
    function calculateIncrease(min, max) {
      if (!min || !max || min <= 0) return 'N/A';
      const increase = ((max - min) / min) * 100;
      return increase.toFixed(2) + '%';
    }

    // Update column visibility
    function updateColumnVisibility() {
      const columns = document.querySelectorAll('.time-column');
      columns.forEach(col => {
        const timeframe = col.getAttribute('data-timeframe');
        if (
          (timeframe === '24h' && !state.show24hColumns) ||
          (timeframe === '7d' && !state.show7dColumns) ||
          (timeframe === '30d' && !state.show30dColumns)
        ) {
          col.style.display = 'none';
        } else {
          col.style.display = '';
        }
      });
    }

    // Toggle column visibility
    function toggleColumnVisibility(timeframe) {
      switch(timeframe) {
        case '24h':
          state.show24hColumns = !state.show24hColumns;
          localStorage.setItem('show24hColumns', state.show24hColumns);
          elements.toggle24hBtn.classList.toggle('active', state.show24hColumns);
          break;
        case '7d':
          state.show7dColumns = !state.show7dColumns;
          localStorage.setItem('show7dColumns', state.show7dColumns);
          elements.toggle7dBtn.classList.toggle('active', state.show7dColumns);
          break;
        case '30d':
          state.show30dColumns = !state.show30dColumns;
          localStorage.setItem('show30dColumns', state.show30dColumns);
          elements.toggle30dBtn.classList.toggle('active', state.show30dColumns);
          break;
      }
      updateColumnVisibility();
    }

    // Get CoinMarketCap URL for a coin
    function getCoinMarketCapUrl(coinId, coinName) {
      if (specialCoinSlugs[coinId]) {
        return `https://coinmarketcap.com/currencies/${specialCoinSlugs[coinId]}/`;
      }
      const slug = coinName.toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');
      return `https://coinmarketcap.com/currencies/${slug}/`;
    }

    // Format date and time for display
    function formatDateTime(date) {
      if (!date) return 'Never updated';
      if (typeof date === 'string') date = new Date(date);
      return date.toLocaleString([], {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    // Format price without decimals for values > 1000
    function formatPrice(price) {
      if (!price) return 'N/A';
      if (price >= 1000) {
        return price.toLocaleString(undefined, {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        });
      }
      return price.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 6
      });
    }

    // Event Listeners
    function setupEventListeners() {
      elements.themeToggle.addEventListener('click', toggleTheme);
      elements.toggle24hBtn.addEventListener('click', () => toggleColumnVisibility('24h'));
      elements.toggle7dBtn.addEventListener('click', () => toggleColumnVisibility('7d'));
      elements.toggle30dBtn.addEventListener('click', () => toggleColumnVisibility('30d'));
      elements.searchInput.addEventListener('input', () => {
        filterCoins();
        renderTable();
      });
      elements.refreshBtn.addEventListener('click', () => {
        const now = new Date();
        if (state.lastUpdated && now - state.lastUpdated < 30000) {
          alert('Please wait at least 30 seconds between refreshes');
          return;
        }
        loadData();
      });
      elements.toggleFavoritesBtn.addEventListener('click', () => {
        state.showFavorites = !state.showFavorites;
        elements.toggleFavoritesBtn.textContent = 
          state.showFavorites ? '👀 Show All' : '⭐ Show Favorites';
        filterCoins();
        renderTable();
      });
      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const sortKey = th.getAttribute('data-sort');
          if (state.sortBy === sortKey) {
            state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
          } else {
            state.sortBy = sortKey;
            state.sortDir = 'asc';
          }
          sortCoins();
          renderTable();
          updateSortIndicators();
        });
      });
      elements.nobitexInput.addEventListener('input', (e) => {
        state.exchangePrices.nobitex = parseFloat(e.target.value) || 0;
        state.exchangeUpdateTimes.nobitex = new Date();
        updateExchangeTimeDisplays();
        updateIRTValues();
        saveExchangeData();
      });
      elements.wallexInput.addEventListener('input', (e) => {
        state.exchangePrices.wallex = parseFloat(e.target.value) || 0;
        state.exchangeUpdateTimes.wallex = new Date();
        updateExchangeTimeDisplays();
        updateIRTValues();
        saveExchangeData();
      });
      elements.okexchangeInput.addEventListener('input', (e) => {
        state.exchangePrices.okexchange = parseFloat(e.target.value) || 0;
        state.exchangeUpdateTimes.okexchange = new Date();
        updateExchangeTimeDisplays();
        updateIRTValues();
        saveExchangeData();
      });
      elements.ramzinexInput.addEventListener('input', (e) => {
        state.exchangePrices.ramzinex = parseFloat(e.target.value) || 0;
        state.exchangeUpdateTimes.ramzinex = new Date();
        updateExchangeTimeDisplays();
        updateIRTValues();
        saveExchangeData();
      });
      elements.exchangeSelect.addEventListener('change', (e) => {
        state.selectedExchange = e.target.value || null;
        updateIRTValues();
      });
    }

    // Save exchange rates and update times
    function saveExchangeData() {
      localStorage.setItem('cryptoExchangeRates', JSON.stringify(state.exchangePrices));
      localStorage.setItem('cryptoExchangeUpdateTimes', JSON.stringify(state.exchangeUpdateTimes));
    }

    // Update exchange time displays
    function updateExchangeTimeDisplays() {
      elements.nobitexUpdateTime.textContent = state.exchangeUpdateTimes.nobitex ? 
        formatDateTime(state.exchangeUpdateTimes.nobitex) : '';
      elements.wallexUpdateTime.textContent = state.exchangeUpdateTimes.wallex ? 
        formatDateTime(state.exchangeUpdateTimes.wallex) : '';
      elements.okexchangeUpdateTime.textContent = state.exchangeUpdateTimes.okexchange ? 
        formatDateTime(state.exchangeUpdateTimes.okexchange) : '';
      elements.ramzinexUpdateTime.textContent = state.exchangeUpdateTimes.ramzinex ? 
        formatDateTime(state.exchangeUpdateTimes.ramzinex) : '';
    }

    // Update IRT values
    function updateIRTValues() {
      if (state.selectedExchange && state.exchangePrices[state.selectedExchange]) {
        renderTable();
      }
    }

    // Calculate IRT price
    function calculateIRTPrice(usdPrice) {
      if (!state.selectedExchange || !state.exchangePrices[state.selectedExchange]) {
        return -1;
      }
      const exchangeRate = state.exchangePrices[state.selectedExchange];
      const irtPrice = usdPrice * exchangeRate;
      
      if (irtPrice < 1 && irtPrice > 0) {
        return irtPrice.toLocaleString(undefined, {
          minimumFractionDigits: 2,
          maximumFractionDigits: 8
        });
      }
      
      if (irtPrice >= 1000) {
        return irtPrice.toLocaleString(undefined, {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        });
      }
      
      return irtPrice.toLocaleString(undefined, {
        minimumFractionDigits: 0,
        maximumFractionDigits: irtPrice < 1000 ? 2 : 0
      });
    }

    // Format number input
    function formatNumberInput(value) {
      if (!value) return '';
      const num = parseFloat(value);
      if (isNaN(num)) return value;
      return num.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });
    }

    // Handle range updates with tooltip timestamps
    function handleDayRangeUpdate(coinId, type, value) {
      const numericValue = parseFloat(value.replace(/,/g, '')) || null;
      
      if (!state.dayRanges[coinId]) {
        state.dayRanges[coinId] = { min: null, max: null };
      }
      state.dayRanges[coinId][type] = numericValue;
      state.dayRanges[coinId][`${type}Updated`] = new Date();
      updateTooltips(); // Add this line
      localStorage.setItem('cryptoDayRanges', JSON.stringify(state.dayRanges));
      
      const inputElement = event.target;
      setTimeout(() => {
        inputElement.value = numericValue ? formatNumberInput(numericValue.toString()) : '';
      }, 0);
      
      renderTable();


    }

    function handleWeekRangeUpdate(coinId, type, value) {
      const numericValue = parseFloat(value.replace(/,/g, '')) || null;
      
      if (!state.weekRanges[coinId]) {
        state.weekRanges[coinId] = { min: null, max: null };
      }
      state.weekRanges[coinId][type] = numericValue;
      state.weekRanges[coinId][`${type}Updated`] = new Date();
      updateTooltips(); // Add this line
      localStorage.setItem('cryptoWeekRanges', JSON.stringify(state.weekRanges));
      
      const inputElement = event.target;
      setTimeout(() => {
        inputElement.value = numericValue ? formatNumberInput(numericValue.toString()) : '';
      }, 0);
      
      renderTable();
    }

    function handleMonthRangeUpdate(coinId, type, value) {
      const numericValue = parseFloat(value.replace(/,/g, '')) || null;
      
      if (!state.monthRanges[coinId]) {
        state.monthRanges[coinId] = { min: null, max: null };
      }
      state.monthRanges[coinId][type] = numericValue;
      state.monthRanges[coinId][`${type}Updated`] = new Date();
      updateTooltips(); // Add this line
      localStorage.setItem('cryptoMonthRanges', JSON.stringify(state.monthRanges));
      
      const inputElement = event.target;
      setTimeout(() => {
        inputElement.value = numericValue ? formatNumberInput(numericValue.toString()) : '';
      }, 0);
      
      renderTable();
    }

    // Data Loading
    async function loadData() {
      try {
        const now = new Date();
        if (state.lastUpdated && now - state.lastUpdated < 30000) {
          console.log('Skipping refresh - in cooldown period');
          return;
        }

        elements.loadingRow.style.display = '';
        elements.errorPara.textContent = '';
        elements.refreshBtn.disabled = true;
        
        const response = await fetch(config.apiUrl + '&price_change_percentage=7d,30d');
        
        if (!response.ok) {
          if (response.status === 429) {
            throw new Error('API rate limit exceeded - please wait');
          }
          throw new Error(`API error: ${response.status}`);
        }
        
        let coins = await response.json();
        coins = coins.filter(coin => !stableCoins.includes(coin.id));
        
        state.allCoins = coins;
        state.lastUpdated = new Date();
        updateLastUpdated();
        
        filterCoins();
        sortCoins();
        renderTable();
      } catch (error) {
        console.error('Failed to load data:', error);
        elements.errorPara.textContent = 
          error.message.includes('rate limit') 
            ? 'API rate limit exceeded. Please wait or refresh later.'
            : 'Failed to load live data. Showing cached data if available.';
        if (state.allCoins.length > 0) {
          filterCoins();
          sortCoins();
          renderTable();
        }
      } finally {
        elements.loadingRow.style.display = 'none';
        elements.refreshBtn.disabled = false;
      }
    }

    // Filtering
    function filterCoins() {
      const searchTerm = elements.searchInput.value.toLowerCase();
      state.displayedCoins = state.allCoins.filter(coin => {
        const matchesSearch = 
          coin.name.toLowerCase().includes(searchTerm) || 
          coin.symbol.toLowerCase().includes(searchTerm);
        const isFavorite = state.favorites.includes(coin.id);
        return state.showFavorites ? matchesSearch && isFavorite : matchesSearch;
      });
    }

    // Sorting
    function sortCoins() {
      state.displayedCoins.sort((a, b) => {
        let valA, valB;
        
        switch (state.sortBy) {
          case 'rank': valA = a.market_cap_rank; valB = b.market_cap_rank; break;
          case 'name': valA = a.name; valB = b.name; break;
          case 'price': valA = a.current_price; valB = b.current_price; break;
          case 'price_irt': 
            valA = parseFloat(calculateIRTPrice(a.current_price).replace(/,/g, '')) || 0;
            valB = parseFloat(calculateIRTPrice(b.current_price).replace(/,/g, '')) || 0;
            break;
          case 'change': valA = a.price_change_percentage_24h; valB = b.price_change_percentage_24h; break;
          case 'change_7d': valA = a.price_change_percentage_7d_in_currency; valB = b.price_change_percentage_7d_in_currency; break;
          case 'change_30d': valA = a.price_change_percentage_30d_in_currency; valB = b.price_change_percentage_30d_in_currency; break;
          case 'market_cap': valA = a.market_cap; valB = b.market_cap; break;
          default: valA = a.market_cap_rank; valB = b.market_cap_rank;
        }
        
        return typeof valA === 'string' 
          ? state.sortDir === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA)
          : state.sortDir === 'asc' ? valA - valB : valB - valA;
      });
    }

    // Rendering with tooltips
    function renderTable() {
      if (state.displayedCoins.length === 0) {
        elements.tableBody.innerHTML = `
          <tr>
            <td colspan="18" style="text-align: center;">
              ${state.showFavorites ? 'No favorites match your search' : 'No coins match your search'}
            </td>
          </tr>
        `;
        updateTooltips(); // Add this at the end
        return;
      }
      
      elements.tableBody.innerHTML = state.displayedCoins.map(coin => {
        const irtPrice = calculateIRTPrice(coin.current_price);
        const dayRange = state.dayRanges[coin.id] || { min: null, max: null };
        const weekRange = state.weekRanges[coin.id] || { min: null, max: null };
        const monthRange = state.monthRanges[coin.id] || { min: null, max: null };
        
        const dayIncrease = calculateIncrease(dayRange.min, dayRange.max);
        const weekIncrease = calculateIncrease(weekRange.min, weekRange.max);
        const monthIncrease = calculateIncrease(monthRange.min, monthRange.max);
        
        const dayMinUpdated = dayRange.minUpdated ? formatDateTime(dayRange.minUpdated) : 'Never updated';
        const dayMaxUpdated = dayRange.maxUpdated ? formatDateTime(dayRange.maxUpdated) : 'Never updated';
        const weekMinUpdated = weekRange.minUpdated ? formatDateTime(weekRange.minUpdated) : 'Never updated';
        const weekMaxUpdated = weekRange.maxUpdated ? formatDateTime(weekRange.maxUpdated) : 'Never updated';
        const monthMinUpdated = monthRange.minUpdated ? formatDateTime(monthRange.minUpdated) : 'Never updated';
        const monthMaxUpdated = monthRange.maxUpdated ? formatDateTime(monthRange.maxUpdated) : 'Never updated';
        
        const coinMarketCapUrl = getCoinMarketCapUrl(coin.id, coin.name);
        
        return `
        <tr>
          <td>${coin.market_cap_rank || 'N/A'}</td>
          <td>
            <img src="${coin.image}" class="crypto-icon" onerror="this.src='https://via.placeholder.com/20'">
            <a href="${coinMarketCapUrl}" target="_blank" class="coin-name">${coin.name}</a> <span style="color: #777;">${coin.symbol.toUpperCase()}</span>
          </td>
          <td>${irtPrice === -1 ? 'N/A' : irtPrice}</td>
          <td>$${formatPrice(coin.current_price)}</td>
          <td class="${coin.price_change_percentage_24h >= 0 ? 'positive' : 'negative'}">
            ${coin.price_change_percentage_24h ? coin.price_change_percentage_24h.toFixed(2) + '%' : 'N/A'}
          </td>
          <td class="${coin.price_change_percentage_7d_in_currency >= 0 ? 'positive' : 'negative'}">
            ${coin.price_change_percentage_7d_in_currency ? coin.price_change_percentage_7d_in_currency.toFixed(2) + '%' : 'N/A'}
          </td>
          <td class="${coin.price_change_percentage_30d_in_currency >= 0 ? 'positive' : 'negative'}">
            ${coin.price_change_percentage_30d_in_currency ? coin.price_change_percentage_30d_in_currency.toFixed(2) + '%' : 'N/A'}
          </td>
          <td class="time-column editable-cell" data-timeframe="24h">
            <div class="tooltip">
              <input type="text" 
                     value="${dayRange.min ? formatNumberInput(dayRange.min.toString()) : ''}" 
                     placeholder="Min"
                     onchange="handleDayRangeUpdate('${coin.id}', 'min', this.value)"
                     onfocus="this.select()">
              <span class="tooltiptext">Last updated: ${dayMinUpdated}</span>
            </div>
          </td>
          <td class="time-column editable-cell" data-timeframe="24h">
            <div class="tooltip">
              <input type="text" 
                     value="${dayRange.max ? formatNumberInput(dayRange.max.toString()) : ''}" 
                     placeholder="Max"
                     onchange="handleDayRangeUpdate('${coin.id}', 'max', this.value)"
                     onfocus="this.select()">
              <span class="tooltiptext">Last updated: ${dayMaxUpdated}</span>
            </div>
          </td>
          <td class="time-column ${dayIncrease !== 'N/A' && parseFloat(dayIncrease) >= 0 ? 'positive' : 'negative'}" data-timeframe="24h">
            ${dayIncrease}
          </td>
          <td class="time-column editable-cell" data-timeframe="7d">
            <div class="tooltip">
              <input type="text" 
                     value="${weekRange.min ? formatNumberInput(weekRange.min.toString()) : ''}" 
                     placeholder="Min"
                     onchange="handleWeekRangeUpdate('${coin.id}', 'min', this.value)"
                     onfocus="this.select()">
              <span class="tooltiptext">Last updated: ${weekMinUpdated}</span>
            </div>
          </td>
          <td class="time-column editable-cell" data-timeframe="7d">
            <div class="tooltip">
              <input type="text" 
                     value="${weekRange.max ? formatNumberInput(weekRange.max.toString()) : ''}" 
                     placeholder="Max"
                     onchange="handleWeekRangeUpdate('${coin.id}', 'max', this.value)"
                     onfocus="this.select()">
              <span class="tooltiptext">Last updated: ${weekMaxUpdated}</span>
            </div>
          </td>
          <td class="time-column ${weekIncrease !== 'N/A' && parseFloat(weekIncrease) >= 0 ? 'positive' : 'negative'}" data-timeframe="7d">
            ${weekIncrease}
          </td>
          <td class="time-column editable-cell" data-timeframe="30d">
            <div class="tooltip">
              <input type="text" 
                     value="${monthRange.min ? formatNumberInput(monthRange.min.toString()) : ''}" 
                     placeholder="Min"
                     onchange="handleMonthRangeUpdate('${coin.id}', 'min', this.value)"
                     onfocus="this.select()">
              <span class="tooltiptext">Last updated: ${monthMinUpdated}</span>
            </div>
          </td>
          <td class="time-column editable-cell" data-timeframe="30d">
            <div class="tooltip">
              <input type="text" 
                     value="${monthRange.max ? formatNumberInput(monthRange.max.toString()) : ''}" 
                     placeholder="Max"
                     onchange="handleMonthRangeUpdate('${coin.id}', 'max', this.value)"
                     onfocus="this.select()">
              <span class="tooltiptext">Last updated: ${monthMaxUpdated}</span>
            </div>
          </td>
          <td class="time-column ${monthIncrease !== 'N/A' && parseFloat(monthIncrease) >= 0 ? 'positive' : 'negative'}" data-timeframe="30d">
            ${monthIncrease}
          </td>
          <td class="hide-mobile">$${(coin.market_cap / 1000000000).toFixed(2)}B</td>
          <td>
            <button class="favorite-btn ${state.favorites.includes(coin.id) ? 'active' : ''}" 
                    data-id="${coin.id}" 
                    aria-label="Toggle favorite">
              ${state.favorites.includes(coin.id) ? '★' : '☆'}
            </button>
          </td>
        </tr>
        `;
      }).join('');
      
      document.querySelectorAll('.favorite-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const coinId = e.currentTarget.getAttribute('data-id');
          toggleFavorite(coinId);
        });
      });
      
      updateColumnVisibility();
    }

    // Favorites
    function toggleFavorite(coinId) {
      const index = state.favorites.indexOf(coinId);
      if (index === -1) {
        state.favorites.push(coinId);
      } else {
        state.favorites.splice(index, 1);
      }
      localStorage.setItem('cryptoFavorites', JSON.stringify(state.favorites));
      if (state.showFavorites) filterCoins();
      renderTable();
    }

    // Helpers
    function updateSortIndicators() {
      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.classList.remove('sort-asc', 'sort-desc');
        if (th.getAttribute('data-sort') === state.sortBy) {
          th.classList.add(`sort-${state.sortDir}`);
        }
      });
    }

    function updateLastUpdated() {
      if (state.lastUpdated) {
        elements.lastUpdatedSpan.textContent = state.lastUpdated.toLocaleTimeString();
      }
    }

    function startAutoRefresh() {
      setInterval(() => {
        loadData();
      }, config.refreshInterval);
    }

    // Global functions for inline handlers
    window.handleDayRangeUpdate = function(coinId, type, value) {
      const numericValue = parseFloat(value.replace(/,/g, '')) || null;
      if (!state.dayRanges[coinId]) state.dayRanges[coinId] = { min: null, max: null };
      state.dayRanges[coinId][type] = numericValue;
      state.dayRanges[coinId][`${type}Updated`] = new Date();
      localStorage.setItem('cryptoDayRanges', JSON.stringify(state.dayRanges));
      const inputElement = event.target;
      setTimeout(() => {
        inputElement.value = numericValue ? formatNumberInput(numericValue.toString()) : '';
      }, 0);
      renderTable();
    };

    window.handleWeekRangeUpdate = function(coinId, type, value) {
      const numericValue = parseFloat(value.replace(/,/g, '')) || null;
      if (!state.weekRanges[coinId]) state.weekRanges[coinId] = { min: null, max: null };
      state.weekRanges[coinId][type] = numericValue;
      state.weekRanges[coinId][`${type}Updated`] = new Date();
      localStorage.setItem('cryptoWeekRanges', JSON.stringify(state.weekRanges));
      const inputElement = event.target;
      setTimeout(() => {
        inputElement.value = numericValue ? formatNumberInput(numericValue.toString()) : '';
      }, 0);
      renderTable();
    };

    window.handleMonthRangeUpdate = function(coinId, type, value) {
      const numericValue = parseFloat(value.replace(/,/g, '')) || null;
      if (!state.monthRanges[coinId]) state.monthRanges[coinId] = { min: null, max: null };
      state.monthRanges[coinId][type] = numericValue;
      state.monthRanges[coinId][`${type}Updated`] = new Date();
      localStorage.setItem('cryptoMonthRanges', JSON.stringify(state.monthRanges));
      const inputElement = event.target;
      setTimeout(() => {
        inputElement.value = numericValue ? formatNumberInput(numericValue.toString()) : '';
      }, 0);
      renderTable();
    };

    window.formatNumberInput = function(value) {
      if (!value) return '';
      const num = parseFloat(value.replace(/,/g, ''));
      if (isNaN(num)) return value;
      return num.toLocaleString(undefined, { maximumFractionDigits: 2 });
    };
  </script>
</body>
</html>
