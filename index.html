<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Tracker | CoinGecko API</title>
  <style>
    :root {
      --primary: #6200ee;
      --positive: #28a745;
      --negative: #dc3545;
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #dee2e6;
    }
    .dark-mode {
      --primary: #bb86fc;
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e1e1e1;
      --border: #333333;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      width: calc(100vw - 100px);
      margin: 0 50px;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    h1 {
      color: var(--primary);
    }
    .status {
      font-size: 0.9em;
      color: #666;
    }
    .controls {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .exchange-controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
      width: 100%;
    }
    .exchange-group {
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .exchange-group label {
      margin-bottom: 5px;
      font-weight: 500;
    }
    .exchange-group .update-time {
      position: absolute;
      right: 0;
      top: 0;
      font-size: 0.7em;
      color: #666;
    }
    .exchange-group input,
    .exchange-group select {
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
      width: 100%;
    }
    #search {
      flex: 1;
      min-width: 200px;
      padding: 10px 15px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--text);
    }
    button {
      padding: 10px 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .toggle-column-btn.active {
      background: var(--positive);
    }
    .table-container {
      overflow-x: auto;
      width: 100%;
      margin-bottom: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--card-bg);
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
      table-layout: fixed;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th {
      background: rgba(0,0,0,0.05);
      font-weight: 600;
      cursor: pointer;
      user-select: none;
      position: relative;
    }
    th:hover {
      background: rgba(0,0,0,0.08);
    }
    th.sort-asc::after {
      content: "↑";
      margin-left: 5px;
    }
    th.sort-desc::after {
      content: "↓";
      margin-left: 5px;
    }
    tr:hover {
      background: rgba(0,0,0,0.03);
    }
    /* Column width adjustments */
    th:nth-child(1), td:nth-child(1) { width: 50px; } /* Rank */
    th:nth-child(2), td:nth-child(2) { width: auto; min-width: 200px; } /* Name */
    th:nth-child(3), td:nth-child(3) { width: 130px; } /* Price (IRT) */
    th:nth-child(4), td:nth-child(4) { width: 120px; } /* Price (USD) */
    th:nth-child(5), td:nth-child(5) { width: 80px; } /* 24h % */
    th:nth-child(6), td:nth-child(6) { width: 80px; } /* 7D % */
    th:nth-child(7), td:nth-child(7) { width: 80px; } /* 30D % */
    th:nth-child(8), td:nth-child(8) { width: 90px; } /* 24h Min */
    th:nth-child(9), td:nth-child(9) { width: 90px; } /* 24h Max */
    th:nth-child(10), td:nth-child(10) { width: 90px; } /* 24h Inc */
    th:nth-child(11), td:nth-child(11) { width: 90px; } /* 7D Min */
    th:nth-child(12), td:nth-child(12) { width: 90px; } /* 7D Max */
    th:nth-child(13), td:nth-child(13) { width: 90px; } /* 7D Inc */
    th:nth-child(14), td:nth-child(14) { width: 90px; } /* 30D Min */
    th:nth-child(15), td:nth-child(15) { width: 90px; } /* 30D Max */
    th:nth-child(16), td:nth-child(16) { width: 90px; } /* 30D Inc */
    th:nth-child(17), td:nth-child(17) { width: 110px; } /* Market Cap */
    th:nth-child(18), td:nth-child(18) { width: 50px; } /* Favorite */
    .positive {
      color: var(--positive);
    }
    .negative {
      color: var(--negative);
    }
    .crypto-icon {
      width: 20px;
      height: 20px;
      margin-right: 8px;
      vertical-align: middle;
      border-radius: 50%;
    }
    .favorite-btn {
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      font-size: 1.2em;
      color: #ccc;
    }
    .favorite-btn.active {
      color: gold;
    }
    #loading, #error {
      text-align: center;
      padding: 20px;
    }
    #loading {
      color: #666;
    }
    #error {
      color: var(--negative);
    }
    .editable-cell {
      padding: 0;
      position: relative;
    }
    .editable-cell input {
      width: 100%;
      height: 100%;
      padding: 10px 12px;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: left;
    }
    .editable-cell input:focus {
      outline: 2px solid var(--primary);
      background: var(--card-bg);
    }
    .coin-name {
      cursor: pointer;
      color: var(--primary);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: calc(100% - 30px);
      vertical-align: middle;
    }
    .coin-name:hover {
      text-decoration: underline;
    }
    /* Fixed Tooltip styles */
    .tooltip-container {
      position: relative;
      display: inline-block;
      width: 100%;
      height: 100%;
    }
    .tooltip-container .tooltip {
      visibility: hidden;
      width: 180px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 6px;
      padding: 5px;
      position: absolute;
      z-index: 1;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.3s;
      font-size: 12px;
    }
    .tooltip-container:hover .tooltip {
      visibility: visible;
      opacity: 1;
    }
    @media (max-width: 768px) {
      body {
        width: calc(100vw - 40px);
        margin: 0 20px;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      th, td {
        padding: 8px 10px;
      }
      .hide-mobile {
        display: none;
      }
      /* Adjust column widths for mobile */
      th:nth-child(3), td:nth-child(3) { width: 100px; } /* Price (IRT) */
      th:nth-child(4), td:nth-child(4) { width: 90px; } /* Price (USD) */
      th:nth-child(5), td:nth-child(5) { width: 70px; } /* 24h % */
      th:nth-child(6), td:nth-child(6) { width: 70px; } /* 7D % */
      th:nth-child(7), td:nth-child(7) { width: 70px; } /* 30D % */
      .tooltip-container .tooltip {
        width: 140px;
        font-size: 11px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>📊 Crypto Tracker</h1>
      <p class="status">Last updated: <span id="last-updated">Never</span></p>
    </div>
    <button id="theme-toggle">🌙 Dark Mode</button>
  </div>
  
  <!-- Exchange Controls -->
  <div class="exchange-controls">
    <div class="exchange-group">
      <label for="nobitex-price">Nobitex Price (USD)</label>
      <span class="update-time" id="nobitex-update-time"></span>
      <input type="number" id="nobitex-price" placeholder="Enter USD price" value="84000">
    </div>
    <div class="exchange-group">
      <label for="wallex-price">Wallex Price (USD)</label>
      <span class="update-time" id="wallex-update-time"></span>
      <input type="number" id="wallex-price" placeholder="Enter USD price" value="84000">
    </div>
    <div class="exchange-group">
      <label for="okexchange-price">OkExchange Price (USD)</label>
      <span class="update-time" id="okexchange-update-time"></span>
      <input type="number" id="okexchange-price" placeholder="Enter USD price" value="84000">
    </div>
    <div class="exchange-group">
      <label for="ramzinex-price">Ramzinex Price (USD)</label>
      <span class="update-time" id="ramzinex-update-time"></span>
      <input type="number" id="ramzinex-price" placeholder="Enter USD price" value="84000">
    </div>
  </div>
  
  <div class="controls">
    <input type="text" id="search" placeholder="Search cryptocurrencies...">
    <select id="exchange-select">
      <option value="nobitex" selected>Nobitex</option>
      <option value="wallex">Wallex</option>
      <option value="okexchange">OkExchange</option>
      <option value="ramzinex">Ramzinex</option>
    </select>
    <button id="toggle-24h" class="toggle-column-btn active">24H Data</button>
    <button id="toggle-7d" class="toggle-column-btn active">7D Data</button>
    <button id="toggle-30d" class="toggle-column-btn active">30D Data</button>
    <button id="save-to-github">💾 Save to GitHub</button>
    <button id="load-from-github">🔄 Load from GitHub</button>
    <button id="refresh-btn">🔄 Refresh</button>
    <button id="toggle-favorites">👀 Show All</button>
  </div>
  
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th data-sort="rank">#</th>
          <th data-sort="name">Coin</th>
          <th data-sort="price_irt">Price (IRT)</th>
          <th data-sort="price">Price (USD)</th>
          <th data-sort="change">24h %</th>
          <th data-sort="change_7d">7D %</th>
          <th data-sort="change_30d">30D %</th>
          <th class="time-column" data-timeframe="24h">24h Min</th>
          <th class="time-column" data-timeframe="24h">24h Max</th>
          <th class="time-column" data-timeframe="24h">24h Inc</th>
          <th class="time-column" data-timeframe="7d">7D Min</th>
          <th class="time-column" data-timeframe="7d">7D Max</th>
          <th class="time-column" data-timeframe="7d">7D Inc</th>
          <th class="time-column" data-timeframe="30d">30D Min</th>
          <th class="time-column" data-timeframe="30d">30D Max</th>
          <th class="time-column" data-timeframe="30d">30D Inc</th>
          <th data-sort="market_cap" class="hide-mobile">Market Cap</th>
          <th>⭐</th>
        </tr>
      </thead>
      <tbody id="crypto-data">
        <tr id="loading">
          <td colspan="18">Loading cryptocurrency data...</td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <p id="error"></p>

  <script>
    // ======================
    // Configuration
    // ======================
    const CONFIG = {
      refreshInterval: 60000, // 1 minute (60,000ms)
      maxCoins: 50, // Only top 50 coins
      apiUrl: 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=50',
      github: {
        repo: 'kingdom2011/Crypto-Tracker',
        branch: 'main',
        dataPath: 'data/crypto-data.json',
        token: localStorage.getItem('github_token') || ''
      }
    };

    // Stable coin IDs to exclude
    const STABLE_COINS = [
      'tether', 'usd-coin', 'binance-usd', 'dai', 'true-usd', 
      'paxos-standard', 'usd-coin-wormhole', 'gemini-dollar',
      'usds', 'bsc-usd', 'usde', 'susds', 'buidl',
      'binance-bridged-usdt-bnb-smart-chain', 'ethena-usde', 
      'blackrock-usd-institutional-digital-liquidity-fund',
      'lido-staked-ether', 'wrapped-bitcoin', 'wrapped-steth',
      'wrapped-eeth', 'coinbase-wrapped-staked-eth', 'weth',
      'bitget-token', 'whitebit', 'coinbase-wrapped-btc',
      'leo-token'
    ];

    // Special coin slugs for CoinMarketCap URLs
    const SPECIAL_COIN_SLUGS = {
      'pi-network': 'pi',
      'ondo-finance': 'ondo-finance',
      'gatetoken': 'gatetoken'
    };

    // Timeframes for range data
    const TIMEFRAMES = ['24h', '7d', '30d'];

    // ======================
    // State Management
    // ======================
    const state = {
      allCoins: [],
      displayedCoins: [],
      favorites: JSON.parse(localStorage.getItem('cryptoFavorites')) || [],
      sortBy: 'rank',
      sortDir: 'asc',
      showFavorites: true,
      lastUpdated: null,
      exchangePrices: {
        nobitex: 84000,
        wallex: 84000,
        okexchange: 84000,
        ramzinex: 84000
      },
      exchangeUpdateTimes: {
        nobitex: null,
        wallex: null,
        okexchange: null,
        ramzinex: null
      },
      dayRanges: JSON.parse(localStorage.getItem('cryptoDayRanges')) || {},
      weekRanges: JSON.parse(localStorage.getItem('cryptoWeekRanges')) || {},
      monthRanges: JSON.parse(localStorage.getItem('cryptoMonthRanges')) || {},
      selectedExchange: 'nobitex',
      darkMode: localStorage.getItem('darkMode') === 'true',
      show24hColumns: localStorage.getItem('show24hColumns') !== 'false',
      show7dColumns: localStorage.getItem('show7dColumns') !== 'false',
      show30dColumns: localStorage.getItem('show30dColumns') !== 'false'
    };

    // ======================
    // DOM Elements
    // ======================
    const elements = {
      tableBody: document.getElementById('crypto-data'),
      searchInput: document.getElementById('search'),
      refreshBtn: document.getElementById('refresh-btn'),
      toggleFavoritesBtn: document.getElementById('toggle-favorites'),
      lastUpdatedSpan: document.getElementById('last-updated'),
      errorPara: document.getElementById('error'),
      loadingRow: document.getElementById('loading'),
      exchangeSelect: document.getElementById('exchange-select'),
      nobitexInput: document.getElementById('nobitex-price'),
      wallexInput: document.getElementById('wallex-price'),
      okexchangeInput: document.getElementById('okexchange-price'),
      ramzinexInput: document.getElementById('ramzinex-price'),
      nobitexUpdateTime: document.getElementById('nobitex-update-time'),
      wallexUpdateTime: document.getElementById('wallex-update-time'),
      okexchangeUpdateTime: document.getElementById('okexchange-update-time'),
      ramzinexUpdateTime: document.getElementById('ramzinex-update-time'),
      themeToggle: document.getElementById('theme-toggle'),
      toggle24hBtn: document.getElementById('toggle-24h'),
      toggle7dBtn: document.getElementById('toggle-7d'),
      toggle30dBtn: document.getElementById('toggle-30d')
    };

    // ======================
    // Initialization
    // ======================
    document.addEventListener('DOMContentLoaded', () => {
      initializeApp();
    });

    function initializeApp() {
      // Load saved exchange rates
      const savedExchangeRates = localStorage.getItem('cryptoExchangeRates');
      if (savedExchangeRates) {
        state.exchangePrices = JSON.parse(savedExchangeRates);
        elements.nobitexInput.value = state.exchangePrices.nobitex;
        elements.wallexInput.value = state.exchangePrices.wallex;
        elements.okexchangeInput.value = state.exchangePrices.okexchange;
        elements.ramzinexInput.value = state.exchangePrices.ramzinex;
      }
      
      // Load saved update times
      const savedUpdateTimes = localStorage.getItem('cryptoExchangeUpdateTimes');
      if (savedUpdateTimes) {
        state.exchangeUpdateTimes = JSON.parse(savedUpdateTimes);
        updateExchangeTimeDisplays();
      }
      
      // Set initial button states
      elements.toggle24hBtn.classList.toggle('active', state.show24hColumns);
      elements.toggle7dBtn.classList.toggle('active', state.show7dColumns);
      elements.toggle30dBtn.classList.toggle('active', state.show30dColumns);
      
      // Set theme
      updateTheme();
      
      // Load data and setup event listeners
      loadData();
      setupEventListeners();
      startAutoRefresh();
      updateColumnVisibility();
    }

    // ======================
    // Tooltip Implementation (Fixed)
    // ======================
    function initTooltips() {
      document.querySelectorAll('.editable-cell').forEach(cell => {
        const input = cell.querySelector('input');
        if (!input) return;
        
        const timeframe = cell.getAttribute('data-timeframe');
        const coinId = input.getAttribute('onchange')?.match(/'([^']+)'/)?.[2];
        const type = input.getAttribute('onchange')?.match(/'([^']+)'/)?.[3];
        
        if (!coinId || !type || !timeframe) return;
        
        const ranges = {
          '24h': state.dayRanges,
          '7d': state.weekRanges,
          '30d': state.monthRanges
        };
        
        const updateTime = ranges[timeframe]?.[coinId]?.[`${type}Updated`] 
          ? formatDateTime(ranges[timeframe][coinId][`${type}Updated`]) 
          : 'Never updated';
        
        // Create tooltip container if it doesn't exist
        if (!cell.querySelector('.tooltip-container')) {
          const tooltipContainer = document.createElement('div');
          tooltipContainer.className = 'tooltip-container';
          tooltipContainer.innerHTML = `
            <input type="text" 
                   value="${input.value}" 
                   placeholder="${type === 'min' ? 'Min' : 'Max'}"
                   onchange="handleRangeUpdate('${timeframe}', '${coinId}', '${type}', this.value)"
                   onfocus="this.select()">
            <span class="tooltip">Last updated: ${updateTime}</span>
          `;
          cell.innerHTML = '';
          cell.appendChild(tooltipContainer);
        } else {
          // Update existing tooltip
          const tooltip = cell.querySelector('.tooltip');
          if (tooltip) {
            tooltip.textContent = `Last updated: ${updateTime}`;
          }
        }
      });
    }

    // ======================
    // Range Data Handling (Fixed)
    // ======================
    function handleRangeUpdate(timeframe, coinId, type, value) {
      const numericValue = parseFloat(value.replace(/,/g, '')) || null;
      const rangeKey = `${timeframe}Ranges`;
      
      if (!state[rangeKey][coinId]) {
        state[rangeKey][coinId] = { min: null, max: null };
      }
      
      state[rangeKey][coinId][type] = numericValue;
      state[rangeKey][coinId][`${type}Updated`] = new Date().toISOString();
      
      // Save to localStorage
      localStorage.setItem(`crypto${timeframe === '24h' ? 'Day' : timeframe === '7d' ? 'Week' : 'Month'}Ranges`, 
        JSON.stringify(state[rangeKey]));
      
      // Update the input value with formatted number
      const inputElement = event.target;
      setTimeout(() => {
        inputElement.value = numericValue ? formatNumberInput(numericValue.toString()) : '';
      }, 0);
      
      // Re-render the table to update all values
      renderTable();
    }

    // ======================
    // Data Loading & Processing
    // ======================
    async function loadData() {
      try {
        const now = new Date();
        if (state.lastUpdated && now - state.lastUpdated < 30000) {
          console.log('Skipping refresh - in cooldown period');
          return;
        }

        showLoadingState();
        
        const response = await fetch(`${CONFIG.apiUrl}&price_change_percentage=7d,30d`);
        
        if (!response.ok) {
          throw new Error(response.status === 429 
            ? 'API rate limit exceeded - please wait' 
            : `API error: ${response.status}`);
        }
        
        let coins = await response.json();
        coins = coins.filter(coin => !STABLE_COINS.includes(coin.id));
        
        state.allCoins = coins;
        state.lastUpdated = new Date();
        updateLastUpdated();
        
        filterCoins();
        sortCoins();
        renderTable();
      } catch (error) {
        handleDataLoadError(error);
      } finally {
        hideLoadingState();
      }
    }

    // ======================
    // UI Rendering (Updated with proper tooltips)
    // ======================
    function renderTable() {
      if (state.displayedCoins.length === 0) {
        elements.tableBody.innerHTML = `
          <tr>
            <td colspan="18" style="text-align: center;">
              ${state.showFavorites ? 'No favorites match your search' : 'No coins match your search'}
            </td>
          </tr>
        `;
        initTooltips();
        return;
      }
      
      elements.tableBody.innerHTML = state.displayedCoins.map(coin => createTableRow(coin)).join('');
      
      // Add event listeners to favorite buttons
      document.querySelectorAll('.favorite-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const coinId = e.currentTarget.getAttribute('data-id');
          toggleFavorite(coinId);
        });
      });
      
      updateColumnVisibility();
      initTooltips(); // Initialize tooltips after rendering
    }

    function createTableRow(coin) {
      const irtPrice = calculateIRTPrice(coin.current_price);
      const dayRange = state.dayRanges[coin.id] || { min: null, max: null };
      const weekRange = state.weekRanges[coin.id] || { min: null, max: null };
      const monthRange = state.monthRanges[coin.id] || { min: null, max: null };
      
      const dayIncrease = calculateIncrease(dayRange.min, dayRange.max);
      const weekIncrease = calculateIncrease(weekRange.min, weekRange.max);
      const monthIncrease = calculateIncrease(monthRange.min, monthRange.max);
      
      const coinMarketCapUrl = getCoinMarketCapUrl(coin.id, coin.name);
      
      return `
      <tr>
        <td>${coin.market_cap_rank || 'N/A'}</td>
        <td>
          <img src="${coin.image}" class="crypto-icon" onerror="this.src='https://via.placeholder.com/20'">
          <a href="${coinMarketCapUrl}" target="_blank" class="coin-name">${coin.name}</a> <span style="color: #777;">${coin.symbol.toUpperCase()}</span>
        </td>
        <td>${irtPrice === -1 ? 'N/A' : irtPrice}</td>
        <td>$${formatPrice(coin.current_price)}</td>
        <td class="${coin.price_change_percentage_24h >= 0 ? 'positive' : 'negative'}">
          ${coin.price_change_percentage_24h ? coin.price_change_percentage_24h.toFixed(2) + '%' : 'N/A'}
        </td>
        <td class="${coin.price_change_percentage_7d_in_currency >= 0 ? 'positive' : 'negative'}">
          ${coin.price_change_percentage_7d_in_currency ? coin.price_change_percentage_7d_in_currency.toFixed(2) + '%' : 'N/A'}
        </td>
        <td class="${coin.price_change_percentage_30d_in_currency >= 0 ? 'positive' : 'negative'}">
          ${coin.price_change_percentage_30d_in_currency ? coin.price_change_percentage_30d_in_currency.toFixed(2) + '%' : 'N/A'}
        </td>
        ${createRangeCell('24h', 'min', coin.id, dayRange.min)}
        ${createRangeCell('24h', 'max', coin.id, dayRange.max)}
        <td class="time-column ${dayIncrease !== 'N/A' && parseFloat(dayIncrease) >= 0 ? 'positive' : 'negative'}" data-timeframe="24h">
          ${dayIncrease}
        </td>
        ${createRangeCell('7d', 'min', coin.id, weekRange.min)}
        ${createRangeCell('7d', 'max', coin.id, weekRange.max)}
        <td class="time-column ${weekIncrease !== 'N/A' && parseFloat(weekIncrease) >= 0 ? 'positive' : 'negative'}" data-timeframe="7d">
          ${weekIncrease}
        </td>
        ${createRangeCell('30d', 'min', coin.id, monthRange.min)}
        ${createRangeCell('30d', 'max', coin.id, monthRange.max)}
        <td class="time-column ${monthIncrease !== 'N/A' && parseFloat(monthIncrease) >= 0 ? 'positive' : 'negative'}" data-timeframe="30d">
          ${monthIncrease}
        </td>
        <td class="hide-mobile">$${(coin.market_cap / 1000000000).toFixed(2)}B</td>
        <td>
          <button class="favorite-btn ${state.favorites.includes(coin.id) ? 'active' : ''}" 
                  data-id="${coin.id}" 
                  aria-label="Toggle favorite">
            ${state.favorites.includes(coin.id) ? '★' : '☆'}
          </button>
        </td>
      </tr>
      `;
    }

    function createRangeCell(timeframe, type, coinId, value) {
      const ranges = {
        '24h': state.dayRanges,
        '7d': state.weekRanges,
        '30d': state.monthRanges
      };
      
      const updateTime = ranges[timeframe]?.[coinId]?.[`${type}Updated`] 
        ? formatDateTime(ranges[timeframe][coinId][`${type}Updated`]) 
        : 'Never updated';
      
      return `
      <td class="time-column editable-cell" data-timeframe="${timeframe}">
        <div class="tooltip-container">
          <input type="text" 
                 value="${value ? formatNumberInput(value.toString()) : ''}" 
                 placeholder="${type === 'min' ? 'Min' : 'Max'}"
                 onchange="handleRangeUpdate('${timeframe}', '${coinId}', '${type}', this.value)"
                 onfocus="this.select()">
          <span class="tooltip">Last updated: ${updateTime}</span>
        </div>
      </td>
      `;
    }

    // ======================
    // Utility Functions
    // ======================
    function calculateIncrease(min, max) {
      if (!min || !max || min <= 0) return 'N/A';
      const increase = ((max - min) / min) * 100;
      return increase.toFixed(2) + '%';
    }

    function getCoinMarketCapUrl(coinId, coinName) {
      if (SPECIAL_COIN_SLUGS[coinId]) {
        return `https://coinmarketcap.com/currencies/${SPECIAL_COIN_SLUGS[coinId]}/`;
      }
      const slug = coinName.toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/(^-|-$)/g, '');
      return `https://coinmarketcap.com/currencies/${slug}/`;
    }

    function formatDateTime(date) {
      if (!date) return 'Never updated';
      if (typeof date === 'string') date = new Date(date);
      return date.toLocaleString([], {
        year: 'numeric',
        month: 'short',
        day: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function formatPrice(price) {
      if (!price) return 'N/A';
      if (price >= 1000) {
        return price.toLocaleString(undefined, {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0
        });
      }
      return price.toLocaleString(undefined, {
        minimumFractionDigits: 2,
        maximumFractionDigits: 6
      });
    }

    function formatNumberInput(value) {
      if (!value) return '';
      const num = parseFloat(value.replace(/,/g, ''));
      if (isNaN(num)) return value;
      return num.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function updateLastUpdated() {
      if (state.lastUpdated) {
        elements.lastUpdatedSpan.textContent = state.lastUpdated.toLocaleTimeString();
      }
    }

    // ======================
    // Global Functions
    // ======================
    window.handleRangeUpdate = handleRangeUpdate;
    window.formatNumberInput = formatNumberInput;
  </script>
</body>
</html>
